name: iOS-Testergebnisse auswerten
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Fehlgeschlagener iPhone-Testlauf
        required: true
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HFit-iOS-Testergebnisse
          path: diagnostic/UIResults.xcresult
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Screenshots und Testergebnisse exportieren
        run: |
          mkdir -p exported
          xcrun xcresulttool export attachments --path diagnostic/UIResults.xcresult --output-path exported
          xcrun xcresulttool get test-results tests --path diagnostic/UIResults.xcresult > exported/tests.json
      - uses: actions/upload-artifact@v4
        with:
          name: HFit-iOS-Diagnose
          path: exported
          retention-days: 7
