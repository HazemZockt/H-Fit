name: iPhone-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode anzeigen
        run: xcodebuild -version
      - name: Berechnungen und Erkennung testen
        run: swift test
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: iPhone-Simulator auswählen
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Einrichtung und Tagesbilanz auf iOS testen
        run: >-
          xcodebuild test -project HFit.xcodeproj -scheme HFit
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/simulator -resultBundlePath build/UIResults
          CODE_SIGNING_ALLOWED=NO
      - name: Native iPhone-App kompilieren
        run: >-
          xcodebuild -project HFit.xcodeproj -scheme HFit
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned IPA verpacken
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/HFit.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../HFit-unsigned.ipa Payload
      - name: IPA zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HFit-iPhone
          path: build/HFit-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Testergebnisse und Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HFit-iOS-Testergebnisse
          path: build/UIResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Screenshots exportieren
        if: always()
        run: |
          if [ -d build/UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UIResults.xcresult --output-path build/screenshots
          fi
      - name: Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HFit-iOS-Screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 7
