name: HFit
options:
  bundleIdPrefix: de.hfit
  deploymentTarget:
    iOS: '17.0'
packages:
  HFitCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  HFit:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HFitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hfit.personal
        PRODUCT_NAME: HFit
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      gatherCoverageData: false
